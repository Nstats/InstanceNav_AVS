# Current psgnav-instance runtime, checked on 2026-11-21.
# Target: Linux x86_64, Python 3.9, PyTorch 2.7.0 / CUDA 11.8 (including L20).
# Pins match the versions loaded from the active environment with PYTHONNOUSERSITE=1.
# This pins the main runtime libraries, not every transitive/system dependency.
#
# From the repository root on the destination machine:
#   PYTHONNOUSERSITE=1 conda env create --no-default-packages -f environment.yml
#   conda activate psgnav-instance
#
# Two CUDA extensions must be built AFTER torch has been installed. They cannot
# share the initial pip transaction because their build scripts import torch.
# Prerequisites: git, a C++ compiler compatible with CUDA 11.8, and a CUDA 11.8
# toolkit containing nvcc/headers. Set CUDA_HOME to that toolkit on the new host;
# PyTorch's bundled CUDA runtime alone does not include a compiler.
# Set CUB_HOME="$CUDA_HOME/include" if that directory contains cub/.
# On an L20, set TORCH_CUDA_ARCH_LIST=8.9 for these builds.
#
# PyTorch3D 0.7.9: same source revision as scripts/build_pytorch3d.sh; use the
# current conda Python, not that script's older .venv / CUDA 12.8 configuration.
#   FORCE_CUDA=1 python -m pip install --no-deps --no-build-isolation \
#     'git+https://github.com/facebookresearch/pytorch3d.git@88e182f989c80836f4bd744e0d9cb1852762ce01'
#
# GroundingDINO 0.1.0: build a local copy with the existing Torch 2.7 compatibility
# patch, preserving the tracked source. The copy below must not already exist.
#   mkdir -p .deps
#   cp -a GroundingDINO .deps/groundingdino-build
#   patch -d .deps/groundingdino-build/groundingdino/models/GroundingDINO/csrc/MsDeformAttn \
#     -p1 < patches/groundingdino-torch27-build.patch
#   python -m pip install --no-deps --no-build-isolation ./.deps/groundingdino-build
#
# GLIP and Segment Anything use this repository's source directly. Data, model
# weights, API credentials and host-specific paths are configured separately.
# The optional VLFM backend also requires a separate VLFM checkout, its model
# server dependencies and weights. See DEPLOYMENT_ZH.md.
# After preparing those resources, run: bash scripts/run_instance100.sh --check-only
name: psgnav-instance
channels:
  - aihabitat
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9.23
  - pip=25.2
  - setuptools=80.9.0
  - wheel=0.45.1

  # Preserve the source environment's Habitat-Sim variant (display, no Bullet).
  - habitat-sim=0.2.4=py3.9_linux_f179b584bcd713c5a2a998132211e2cae881d6d1
  - habitat-sim-mutex=1.0=display_nobullet

  # Conda-installed Habitat/numerical dependencies. Use the same OpenBLAS
  # variant as the source environment. The pip Matplotlib pin restores the
  # runtime version after Habitat-Sim pulls in its conda dependency.
  - libblas=3.11.0=5_h4a7cf45_openblas
  - libopenblas=0.3.30=pthreads_h94d23a6_4
  - numpy=1.26.4
  - scipy=1.13.1
  - numba=0.60.0
  - llvmlite=0.43.0
  - quaternion=2023.0.4
  - pillow=9.5.0
  - attrs=25.3.0
  - imageio=2.37.0
  - imageio-ffmpeg=0.6.0
  - tqdm=4.67.1
  - gitpython=3.1.45
  - smmap=3.0.5

  - pip:
      # CUDA-tagged wheels are not available on the default PyPI index.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.0+cu118
      - torchvision==0.22.0+cu118
      - matplotlib==3.9.4
      - transformers==4.26.0
      - tokenizers==0.13.3
      - huggingface-hub==0.36.2
      - timm==0.4.12
      - open3d==0.19.0
      - opencv-python==4.5.5.64
      - scikit-image==0.24.0
      - scikit-learn==1.6.1
      - scikit-fmm==2025.1.29
      - faiss-cpu==1.8.0.post1
      - pandas==2.3.3
      - gym==0.23.0
      - yacs==0.1.8
      - omegaconf==2.3.1
      - PyYAML==6.0.3
      - nltk==3.9.2
      - inflect==7.5.0
      - einops==0.8.2
      - prettytable==3.16.0
      - ftfy==6.3.1
      - pycocotools==2.0.11
      - python-dotenv==1.2.1
      - requests==2.32.5
      - Flask==3.1.3
      - pytest==8.4.2
      - iopath==0.1.10
      - addict==2.4.0
      - yapf==0.43.0
      - networkx==3.2.1
      - supervision==0.29.1
      - pslpython==2.3.3
      - ninja==1.13.2
      # Habitat-Lab 0.2.1 must resolve to this checkout, not the source host's path.
      - -e ./habitat-lab
variables:
  PYTHONNOUSERSITE: '1'
  MPLBACKEND: Agg
