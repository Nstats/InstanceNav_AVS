SEED: 77
ENVIRONMENT:
  MAX_EPISODE_STEPS: 1000
  ATOMIC_ACTIONS: True
  ITERATOR_OPTIONS:
    SHUFFLE: False
    CYCLE: False
    MAX_SCENE_REPEAT_STEPS: -1
SIMULATOR:
  SCENE_DATASET: data/scene_datasets/hm3d_v0.2/hm3d_annotated_basis.scene_dataset_config.json
  TURN_ANGLE: 30
  TILT_ANGLE: 30
  ACTION_SPACE_CONFIG: "v1"
  AGENT_0:
    # SEMANTIC_SENSOR is diagnostics-only: nothing in the policy reads
    # observations['semantic']; the benchmark loop logs goal visibility from it.
    SENSORS: ['RGB_SENSOR', 'DEPTH_SENSOR', 'SEMANTIC_SENSOR']
    HEIGHT: 0.88
    RADIUS: 0.18
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: False
  SEMANTIC_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    NORMALIZE_DEPTH: False
    MIN_DEPTH: 0.5
    MAX_DEPTH: 10.0
    POSITION: [0, 0.88, 0]
TASK:
  STOP_DISTANCE: 1.0
  TYPE: ObjectNav-v1
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT", "LOOK_UP", "LOOK_DOWN", "TURN_RIGHT_2"]
  SUCCESS_DISTANCE: 1.0

  SENSORS: ['OBJECTGOAL_SENSOR', 'COMPASS_SENSOR', 'GPS_SENSOR']
  GOAL_SENSOR_UUID: objectgoal

  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL']

  DISTANCE_TO_GOAL:
    DISTANCE_TO: VIEW_POINTS
  SUCCESS:
    SUCCESS_DISTANCE: 1.0

DATASET:
  TYPE: PSGInstanceNav-v1
  SPLIT: val
  DATA_PATH: data/datasets/instancenav/val10/val10.json.gz
  SCENES_DIR: data/scene_datasets
