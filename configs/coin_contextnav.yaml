# CoIN-Bench official sensor/task protocol (intelligolabs/CoIN,
# config/experiments/uncertainty_objectnav_hm3d.yaml): 500 atomic steps,
# success = STOP within 0.25 m geodesic of a target view point, RGB 512x512 HFOV 42,
# depth 512x512 HFOV 79 (habitat-lab 0.2.4 default) 0-5 m, both at 1.31 m on a 1.41 m /
# 0.17 m agent, sliding on. Full instruction, no user interaction.
# Policy stopping uses the legacy Euclidean 0.75 m rule for the CoIN stop-metric
# ablation; FMM still plans the path.
# This policy distance is separate from official success_distance. The SEMANTIC_SENSOR block is only attached by
# tools/check_coin_protocol.py; the policy never receives it.
SEED: 77
ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
  ATOMIC_ACTIONS: True
  ITERATOR_OPTIONS:
    SHUFFLE: False
    CYCLE: False
    MAX_SCENE_REPEAT_STEPS: -1
SIMULATOR:
  SCENE_DATASET: data/scene_datasets/hm3d_v0.2/hm3d_annotated_basis.scene_dataset_config.json
  TURN_ANGLE: 30
  TILT_ANGLE: 30
  FORWARD_STEP_SIZE: 0.25
  ACTION_SPACE_CONFIG: "v1"
  AGENT_0:
    SENSORS: ['RGB_SENSOR', 'DEPTH_SENSOR']
    HEIGHT: 1.41
    RADIUS: 0.17
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  SEMANTIC_SENSOR:
    WIDTH: 512
    HEIGHT: 512
    HFOV: 42
    POSITION: [0, 1.31, 0]
  RGB_SENSOR:
    WIDTH: 512
    HEIGHT: 512
    HFOV: 42
    POSITION: [0, 1.31, 0]
  DEPTH_SENSOR:
    WIDTH: 512
    HEIGHT: 512
    HFOV: 79
    NORMALIZE_DEPTH: False
    MIN_DEPTH: 0.0
    MAX_DEPTH: 5.0
    POSITION: [0, 1.31, 0]
TASK:
  TYPE: ObjectNav-v1
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT", "LOOK_UP", "LOOK_DOWN", "TURN_RIGHT_2"]
  STOP_DISTANCE: 0.75
  STOP_DISTANCE_METRIC: euclidean
  SENSORS: ['OBJECTGOAL_SENSOR', 'COMPASS_SENSOR', 'GPS_SENSOR']
  GOAL_SENSOR_UUID: objectgoal
  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL', 'DISTRACTOR_SUCCESS']
  DISTANCE_TO_GOAL:
    DISTANCE_TO: VIEW_POINTS
  SUCCESS:
    SUCCESS_DISTANCE: 0.25
  DISTRACTOR_SUCCESS:
    TYPE: DistractorSuccess
DATASET:
  TYPE: CoINInstanceNav-v1
  SPLIT: val_seen
  DATA_PATH: data/datasets/CoIN/CoIN-Bench/{split}/{split}.json.gz
  SCENES_DIR: data/scene_datasets
